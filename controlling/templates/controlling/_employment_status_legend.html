<div class="small text-muted mb-3">
    <span class="me-3"><span class="status-legend-swatch" style="background-color: var(--gp-primary);"></span>Vertrag</span>
    <span class="me-3"><span class="status-legend-swatch" style="background-color: var(--gp-note); border: 2px dashed var(--gp-warning);"></span>Geplant</span>
    <span><span class="status-legend-swatch" style="background-color: var(--gp-primary); border: 2px dashed var(--gp-warning); background-image: repeating-linear-gradient(45deg, rgba(var(--gp-background-rgb), 0.35) 0 4px, transparent 4px 8px);"></span>Umbuchung (← von / → nach)</span>
    {% if show_sap_contracts %}<span class="ms-3"><span class="status-legend-swatch" style="background-color: var(--gp-success-subtle); border: 1px solid var(--gp-success); height: 0.5rem;"></span>SAP-Vertragszeitraum</span>{% endif %}
</div>
